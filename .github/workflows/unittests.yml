name: Unit Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ['8.4.27', '8.5.12']

    name: PHP ${{ matrix.php-version }} Tests

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip, bcmath, gd, curl, sqlite3, pdo_sqlite
        coverage: none
        tools: composer:2.10.3

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Copy .env file and configure for testing
      run: |
        cp .env.example .env
        echo "APP_ENV=testing" >> .env
        echo "APP_DEBUG=true" >> .env
        echo "APP_KEY=" >> .env
        echo "DB_CONNECTION=sqlite" >> .env
        echo "DB_DATABASE=database/testing.sqlite" >> .env
        echo "CACHE_STORE=array" >> .env
        echo "SESSION_DRIVER=array" >> .env
        echo "QUEUE_CONNECTION=sync" >> .env
        echo "LOG_CHANNEL=stderr" >> .env
        echo "MAIL_MAILER=array" >> .env
        echo "BROADCAST_CONNECTION=log" >> .env

    - name: Create SQLite database for testing
      run: |
        mkdir -p database
        touch database/testing.sqlite

    - name: Install Composer dependencies
      run: composer install --no-interaction --prefer-dist --no-progress

    - name: Check actual PHP platform requirements
      run: composer check-platform-reqs

    - name: Audit Composer dependencies
      run: composer audit --locked

    - name: Generate application key
      run: php artisan key:generate --force

    - name: Install npm dependencies
      run: |
        if [ -f package.json ]; then
          npm ci
        fi

    - name: Run database migrations
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/testing.sqlite
        APP_ENV: testing
      run: php artisan migrate --force

    - name: Run Laravel tests (with debugging)
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/testing.sqlite
        APP_ENV: testing
      run: |
        php artisan test --debug
        echo "Exit code: $?"

    - name: Audit and build frontend assets
      run: |
        npm audit
        npm run build
